<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HELIOS — on-board crew health monitoring for long-duration spaceflight.">
  <title>HELIOS Crew Health</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23f5b54a'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%235ab0ff' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#05070d">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div id="boot" role="status" aria-label="Starting HELIOS">
    <div class="boot-inner">
      <svg viewBox="0 0 32 32" class="boot-logo" aria-hidden="true"><circle cx="16" cy="16" r="6.5" class="sun"/><ellipse cx="16" cy="16" rx="14" ry="6" class="orbit" transform="rotate(-25 16 16)"/></svg>
      <h1>HELIOS</h1>
      <p>Crew Health Monitor · Deep Space Habitat</p>
      <ul class="boot-log"></ul>
      <div class="boot-bar"><i></i></div>
      <small>Click or press any key to skip</small>
    </div>
  </div>
  <a class="skip" href="#view">Skip to content</a>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg viewBox="0 0 32 32" class="logo" aria-hidden="true"><circle cx="16" cy="16" r="6.5" class="sun"/><ellipse cx="16" cy="16" rx="14" ry="6" class="orbit" transform="rotate(-25 16 16)"/></svg>
        <div><b>HELIOS</b><small>Crew Health Monitor</small></div>
      </div>
      <nav id="nav" aria-label="Main"></nav>
      <div class="sidebar-foot">
        <span class="status-dot"></span>
        <div><b>On-board · offline-first</b><small>Data stays on the vehicle until you downlink it.</small></div>
      </div>
    </aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div id="alert-bar" role="alert" hidden></div>
      <main id="view" tabindex="-1"></main>
      <div id="announce" class="sr-only" aria-live="polite"></div>
      <footer class="foot">HELIOS prototype · simulated sensor data · not a medical device</footer>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="palette" hidden></div>
  <div id="more-sheet" hidden data-action="more-scrim"></div>

  <script src="js/i18n.js"></script>
  <script src="js/vault.js"></script>
  <script src="js/cosmos.js"></script>
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/protocols.js"></script>
  <script src="js/sanitize.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/validation-data.js"></script>
  <script src="js/lab-model.js"></script>
  <script src="js/features/labs.js"></script>
  <script src="js/features/wearables.js"></script>
  <script src="js/features/outcomes.js"></script>
  <script src="js/features/triage.js"></script>
  <script src="js/features/medkit.js"></script>
  <script src="js/features/planner.js"></script>
  <script src="js/features/cognition.js"></script>
  <script src="js/features/nutrition.js"></script>
  <script src="js/features/spaceweather.js"></script>
  <script src="js/features/settings.js"></script>
  <script src="js/features/tour.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
